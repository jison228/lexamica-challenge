services:
  mongo:
    image: mongo:7
    container_name: lexamica-mongo
    restart: unless-stopped
    # Single-node replica set — required for multi-document transactions.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    # Self-initialize the replica set on first healthy start (idempotent).
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:
